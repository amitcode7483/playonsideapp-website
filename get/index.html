<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Get Play Onside</title>
  <meta name="description" content="Get Play Onside free on the App Store or Google Play. Every sport, your people." />
  <meta property="og:title" content="Get Play Onside" />
  <meta property="og:description" content="Free on the App Store and Google Play." />
  <meta name="theme-color" content="#14243A" />
  <meta name="robots" content="noindex" />
  <link rel="icon" href="../favicon.ico" sizes="48x48" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="../favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="../apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&display=swap" />
  <style>
    :root { --chalk: #F5F7F2; --navy: #14243A; --muted: #56627A; --turf: #2E7D4F; --turf-dark: #23633E; --line: #DCE3DA; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { min-height: 100vh; background: var(--navy); color: var(--navy); font: 17px/1.55 'Barlow', system-ui, sans-serif; display: flex; flex-direction: column; justify-content: flex-end; }
    .top { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 48px 24px 24px; color: #fff; text-align: center; }
    .top p { margin: 0; color: #C9D2DF; }
    h1 { margin: 0; font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 800; font-size: 44px; line-height: 0.95; }
    .sheet { background: var(--chalk); border-radius: 28px 28px 0 0; padding: 28px 24px 40px; display: flex; flex-direction: column; gap: 14px; max-width: 520px; width: 100%; margin: 0 auto; }
    .btn { display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 14px; background: var(--turf); color: #fff; font-weight: 700; font-size: 18px; text-decoration: none; }
    .btn:hover { background: var(--turf-dark); }
    .small { margin: 0; font-size: 15px; color: var(--muted); text-align: center; }
    .code { font-family: ui-monospace, Menlo, monospace; background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 12px; text-align: center; font-size: 28px; font-weight: 700; letter-spacing: 3px; color: var(--navy); user-select: all; word-break: break-all; }
    .bad { display: none; }
    body.no-code .ok { display: none; }
    body.no-code .bad { display: block; }
      .btn.alt { background: var(--navy); }
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && 'ontouchend' in document);
      var android = /Android/i.test(ua);
      if (ios) location.replace('https://apps.apple.com/app/play-onside/id6830015365');
      else if (android) location.replace('https://play.google.com/store/apps/details?id=com.playonsideapp.app');
    })();
  </script>
</head>
<body>
  <div class="top">
    <svg width="72" height="72" viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="b"><circle cx="16" cy="16" r="13"/></clipPath></defs><circle cx="16" cy="16" r="14" fill="#B3261E" stroke="#F5F7F2" stroke-width="1.6"/><g clip-path="url(#b)" transform="rotate(-35 16 16)" fill="none" stroke="#F5F7F2" stroke-linecap="round"><path d="M0 16.6 Q16 13.6 32 16.6" stroke-width="1.5"/><path d="M0 14 Q16 11 32 14" stroke-width="1.1" stroke-dasharray="1.1 1.5"/><path d="M0 19.2 Q16 16.2 32 19.2" stroke-width="1.1" stroke-dasharray="1.1 1.5"/></g></svg>
    <h1>Get Play Onside</h1>
    <p>Every sport. Your people. Free.</p>
  </div>
  <div class="sheet">
    <a class="btn" href="https://apps.apple.com/app/play-onside/id6830015365">Download on the App Store</a>
    <a class="btn alt" href="https://play.google.com/store/apps/details?id=com.playonsideapp.app">Get it on Google Play</a>
    <p class="small"><a href="/">More about Play Onside</a></p>
  </div>
</body>
</html>
